date: 2026-11-23
gym: PERE
sessions:
  - id: hyfit
    title: HY-FIT
    focus: team of 2
    notes: ["고르는 재미!"]
    assumptions: ["i go you go: 한 명씩 번갈아 1라운드, 각자 7라운드로 해석"]
    blocks:
      - type: metcon
        format: for_time
        rounds: 7
        team: {size: 2, style: igyg, rounds_scope: each}
        intensity: moderate
        items:
          - choice:
              - {movement: row, distance_m: 100}
              - {movement: bike_erg, distance_m: 200}
          - choice:
              - {movement: deadlift, reps: 8}
              - {movement: goblet_squat, reps: 12}
          - choice:
              - {movement: burpee, reps: 13}
              - {movement: abmat_situp, reps: 20}
          - {movement: db_box_step_up, reps: 10}

  - id: weight
    title: WEIGHT
    focus: 하체 볼륨
    notes: ["뒷벅지 엉덩이 타겟"]
    blocks:
      - type: strength
        intent: volume
        items:
          - {movement: leg_curl, reps: 12}
          - {movement: barbell_back_lunge, reps: 8, per_side: true}
          - {movement: side_lunge, reps: 12}

  - id: cardio
    title: CARDIO
    focus: sweat
    notes: ["무겁게 하면 재밌어요"]
    assumptions: ["team of 2: 라운드마다 두 사람이 횟수를 나눠서 수행(절반씩)으로 해석"]
    blocks:
      - type: metcon
        format: for_time
        rounds: 8
        team: {size: 2, style: split}
        intensity: heavy
        items:
          - {movement: kb_swing_squat, reps: 24}
          - {movement: db_hang_cluster, reps: 20}
          - {movement: burpee_over_db, reps: 18}
          - {movement: kb_head_cutter, reps: 16}
