# ── 수평 당기기 ───────────────────────────────────────────
barbell_row:  {ko: 바벨로우, aliases: ["barbell row", "BB row", "bent over row", "바벨 로우", "벤트오버 로우"], implement: barbell, pattern: pull_h, cat: W, ref: barbell_row, ratio: 1.0, cycle_s: 2.2, fatigue: {pull_h: 1.0, hinge: 0.3}}
seal_row:     {ko: 씰로우, aliases: ["seal row", "씰 로우", "실로우"], implement: barbell, pattern: pull_h, cat: W, ref: barbell_row, ratio: 0.85, cycle_s: 2.2}
db_row:       {ko: 덤벨로우, aliases: ["db row", "dumbbell row", "one arm row", "덤벨 로우", "원암 로우"], implement: dumbbell, hands: 1, pattern: pull_h, cat: W, ref: barbell_row, ratio: 0.55, cycle_s: 2.2}

# ── 수직 당기기 ───────────────────────────────────────────
pull_up:      {ko: 풀업, aliases: ["pull up", "pullup", "chin up", "턱걸이", "풀 업"], implement: bodyweight, pattern: pull_v, cat: G, ref: pull_up, ratio: 1.0, bw_frac: 1.0, weightable: true, cycle_s: 1.6}

