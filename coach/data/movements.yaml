burpee_broad_jump: {ko: 버피 브로드 점프, aliases: ["burpee broad jump", "버피 브로드점프"], implement: bodyweight, pattern: plyo, cat: G, speed_mps: 0.45, fatigue: {plyo: 1.0, push_h: 0.3}}

# ── 운반 / 썰매 (HYROX) ──────────────────────────────────
