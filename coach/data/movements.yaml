burpee_over_db:   {ko: 버피 오버 덤벨, aliases: ["burpee over the db", "burpee over db", "burpee over dumbbell", "버피 오버 더 덤벨"], implement: bodyweight, pattern: plyo, cat: G, unbroken: 40, cycle_s: 4.2, fatigue: {plyo: 1.0, push_h: 0.3, squat: 0.2}}
