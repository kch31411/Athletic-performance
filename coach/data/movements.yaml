# ── 수평 당기기 ───────────────────────────────────────────
barbell_row:  {ko: 바벨로우, implement: barbell, pattern: pull_h, cat: W, ref: barbell_row, ratio: 1.0, cycle_s: 2.2, fatigue: {pull_h: 1.0, hinge: 0.3}}
seal_row:     {ko: 씰로우, implement: barbell, pattern: pull_h, cat: W, ref: barbell_row, ratio: 0.85, cycle_s: 2.2}
db_row:       {ko: 덤벨로우, implement: dumbbell, hands: 1, pattern: pull_h, cat: W, ref: barbell_row, ratio: 0.55, cycle_s: 2.2}

# ── 수직 당기기 ───────────────────────────────────────────
pull_up:      {ko: 풀업, implement: bodyweight, pattern: pull_v, cat: G, ref: pull_up, ratio: 1.0, bw_frac: 1.0, weightable: true, cycle_s: 1.6}

# ── 올림픽 리프팅 / 파워 ─────────────────────────────────
clean_and_jerk:      {ko: 클린 앤 저크, implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 1.0, cycle_s: 4.5, fatigue: {olympic: 1.0, squat: 0.4, hinge: 0.4, push_v: 0.4}}
hang_clean_and_jerk: {ko: 행 클린 앤 저크, implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.92, cycle_s: 4.0, fatigue: {olympic: 1.0, squat: 0.3, hinge: 0.3, push_v: 0.4}}
power_clean:         {ko: 파워 클린, implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.90, cycle_s: 3.0, fatigue: {olympic: 1.0, hinge: 0.4}}
