sled_pull:     {ko: 슬레드 풀, aliases: ["sled pull", "슬레드풀", "썰매 당기기"], implement: other, pattern: pull_h, cat: W, speed_mps: 0.35}

# ── 머신(에르고) ─────────────────────────────────────────
row:          {ko: 로잉, aliases: ["row", "rowing", "rower", "로잉머신", "로우 머신"], implement: erg, erg: row, cat: M, fatigue: {pull_h: 0.5, squat: 0.3, hinge: 0.3}}
ski:          {ko: 스키에르그, aliases: ["ski", "ski erg", "skierg", "스키", "스키 에르그"], implement: erg, erg: ski, cat: M, fatigue: {pull_v: 0.5, core: 0.3}}
bike_erg:     {ko: 바이크, aliases: ["bike", "bike erg", "bikeerg", "바이크에르그"], implement: erg, erg: bike, cat: M, fatigue: {squat: 0.5}}
assault_bike: {ko: 어썰트 바이크, aliases: ["assault bike", "assault", "air bike", "echo bike", "ab", "어썰트", "에어바이크"], implement: erg, erg: assault, cat: M, fatigue: {squat: 0.4, push_h: 0.2}}
run:          {ko: 러닝, aliases: ["run", "running", "treadmill", "런닝", "달리기", "트레드밀"], implement: erg, erg: run, cat: M, fatigue: {lunge: 0.4, squat: 0.3}}
machine:      {ko: 머신(선택), aliases: ["machine", "머신", "any machine"], implement: erg, erg: preferred, cat: M, fatigue: {squat: 0.3, pull_h: 0.3}}
