hang_clean:          {ko: 행 클린, implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.92, cycle_s: 3.0, fatigue: {olympic: 1.0, squat: 0.3, hinge: 0.3}}
