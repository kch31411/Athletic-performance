# 동작 카탈로그
#   implement : barbell | dumbbell | kettlebell | bodyweight | machine | erg | other
#   pattern   : squat | hinge | lunge | push_h | push_v | pull_h | pull_v | olympic | core | plyo
#   cat       : W(웨이트) | G(맨몸/체조) | M(단일구조 유산소)
#   ref/ratio : 1RM = ratio × 기준 리프트(ref)의 1RM  (덤벨은 한 손 기준 kg)
#   bw_frac   : 체중 중 실제로 드는 비율 (맨몸 근력 동작)
#   unbroken  : 근력 모델이 없는 컨디셔닝 동작의 기준 연속 반복 수 (중급 기준)
#   cycle_s   : 메트콘에서 1회 반복에 걸리는 기준 시간(초)
#   fatigue   : 패턴별 국소 피로 기여도 (생략 시 {pattern: 1})

# ── 스쿼트 ────────────────────────────────────────────────
back_squat:      {ko: 백스쿼트, implement: barbell, pattern: squat, cat: W, ref: back_squat, ratio: 1.0, cycle_s: 3.0}
front_squat:     {ko: 프론트 스쿼트, implement: barbell, pattern: squat, cat: W, ref: back_squat, ratio: 0.85, cycle_s: 2.6}
heel_up_squat:   {ko: 힐업 스쿼트, implement: barbell, pattern: squat, cat: W, ref: back_squat, ratio: 0.85, cycle_s: 3.0}
goblet_squat:    {ko: 고블릿 스쿼트, implement: dumbbell, hands: 1, pattern: squat, cat: W, ref: back_squat, ratio: 0.40, cycle_s: 2.2}
db_front_squat:  {ko: 덤벨 스쿼트, implement: dumbbell, pattern: squat, cat: W, ref: back_squat, ratio: 0.28, cycle_s: 2.0}
air_squat:       {ko: 에어 스쿼트, implement: bodyweight, pattern: squat, cat: G, unbroken: 70, cycle_s: 1.3}
jump_squat:      {ko: 점프 스쿼트, implement: bodyweight, pattern: squat, cat: G, unbroken: 40, cycle_s: 1.4, fatigue: {squat: 0.6, plyo: 0.6}}
thruster:        {ko: 쓰러스터, implement: barbell, pattern: squat, cat: W, ref: back_squat, ratio: 0.62, cycle_s: 2.6, fatigue: {squat: 0.8, push_v: 0.6}}
db_thruster:     {ko: 덤벨 쓰러스터, implement: dumbbell, pattern: squat, cat: W, ref: back_squat, ratio: 0.26, cycle_s: 2.5, fatigue: {squat: 0.8, push_v: 0.6}}
db_hang_cluster: {ko: 덤벨 행 클러스터, implement: dumbbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.36, cycle_s: 3.5, fatigue: {olympic: 0.7, squat: 0.7, push_v: 0.5}}
wall_ball:       {ko: 월볼, implement: other, pattern: squat, cat: W, unbroken: 40, cycle_s: 2.0, fatigue: {squat: 0.6, push_v: 0.4}}

# ── 런지 / 편측 하체 ─────────────────────────────────────
split_squat:        {ko: 스플릿 스쿼트, implement: dumbbell, pattern: lunge, cat: W, ref: back_squat, ratio: 0.25, cycle_s: 2.6}
barbell_back_lunge: {ko: 바벨 백런지, implement: barbell, pattern: lunge, cat: W, ref: back_squat, ratio: 0.60, cycle_s: 2.5}
side_lunge:         {ko: 사이드 런지, implement: dumbbell, hands: 1, pattern: lunge, cat: W, ref: back_squat, ratio: 0.25, cycle_s: 2.6}
walking_lunge:      {ko: 워킹 런지, implement: dumbbell, pattern: lunge, cat: W, ref: back_squat, ratio: 0.25, cycle_s: 1.5}
db_box_step_up:     {ko: 덤벨 박스 스텝업, implement: dumbbell, pattern: lunge, cat: W, ref: back_squat, ratio: 0.25, cycle_s: 2.5}
db_box_step_over:   {ko: 덤벨 박스 스텝오버, implement: dumbbell, pattern: lunge, cat: W, ref: back_squat, ratio: 0.25, cycle_s: 3.0}
kb_box_step_up:     {ko: 케틀벨 박스 스텝업, implement: kettlebell, pattern: lunge, cat: W, ref: back_squat, ratio: 0.25, cycle_s: 2.5}
sandbag_lunge:      {ko: 샌드백 런지, implement: other, pattern: lunge, cat: W, speed_mps: 0.7}

# ── 힌지 ──────────────────────────────────────────────────
deadlift:        {ko: 데드리프트, implement: barbell, pattern: hinge, cat: W, ref: deadlift, ratio: 1.0, cycle_s: 2.5}
hip_thrust:      {ko: 힙쓰러스트, implement: barbell, pattern: hinge, cat: W, ref: deadlift, ratio: 1.05, cycle_s: 2.6}
leg_curl:        {ko: 레그컬, implement: machine, pattern: hinge, cat: W, ref: deadlift, ratio: 0.35, cycle_s: 2.6}
kb_swing:        {ko: 케틀벨 스윙, implement: kettlebell, pattern: hinge, cat: W, ref: deadlift, ratio: 0.33, cycle_s: 1.8}
kb_swing_squat:  {ko: 케틀벨 스윙 스쿼트, implement: kettlebell, pattern: hinge, cat: W, ref: deadlift, ratio: 0.30, cycle_s: 3.2, fatigue: {hinge: 0.8, squat: 0.7}}

# ── 수평 밀기 ─────────────────────────────────────────────
bench_press:      {ko: 벤치프레스, implement: barbell, pattern: push_h, cat: W, ref: bench_press, ratio: 1.0, cycle_s: 2.5}
incline_db_press: {ko: 인클라인 덤벨프레스, implement: dumbbell, pattern: push_h, cat: W, ref: bench_press, ratio: 0.40, cycle_s: 2.6, fatigue: {push_h: 1.0, push_v: 0.3}}
db_pullover:      {ko: 덤벨 풀오버, implement: dumbbell, hands: 1, pattern: push_h, cat: W, ref: bench_press, ratio: 0.40, cycle_s: 3.0, fatigue: {push_h: 0.5, pull_v: 0.5}}
push_up:          {ko: 푸쉬업, implement: bodyweight, pattern: push_h, cat: G, ref: bench_press, ratio: 1.30, bw_frac: 0.65, cycle_s: 1.2}

# ── 수직 밀기 ─────────────────────────────────────────────
strict_press:   {ko: 스트릭트 프레스, implement: barbell, pattern: push_v, cat: W, ref: strict_press, ratio: 1.0, cycle_s: 2.5}
push_press:     {ko: 푸쉬프레스, implement: barbell, pattern: push_v, cat: W, ref: strict_press, ratio: 1.30, cycle_s: 2.0}
db_push_press:  {ko: 덤벨 푸쉬프레스, implement: dumbbell, pattern: push_v, cat: W, ref: strict_press, ratio: 0.55, cycle_s: 2.0}
pike_push_up:   {ko: 파이크 푸쉬업, implement: bodyweight, pattern: push_v, cat: G, ref: strict_press, ratio: 1.50, bw_frac: 0.70, cycle_s: 1.8}
