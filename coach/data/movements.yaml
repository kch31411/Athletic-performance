run:          {ko: 러닝, implement: erg, erg: run, cat: M, fatigue: {lunge: 0.4, squat: 0.3}}
machine:      {ko: 머신(선택), implement: erg, erg: preferred, cat: M, fatigue: {squat: 0.3, pull_h: 0.3}}
