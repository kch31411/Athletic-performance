clean_and_jerk:      {ko: 클린 앤 저크, aliases: ["clean and jerk", "clean & jerk", "C&J", "클린앤저크", "용상"], implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 1.0, cycle_s: 4.5, fatigue: {olympic: 1.0, squat: 0.4, hinge: 0.4, push_v: 0.4}}
hang_clean_and_jerk: {ko: 행 클린 앤 저크, aliases: ["hang clean and jerk", "hang clean & jerk", "행 클린앤저크", "hang C&J"], implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.92, cycle_s: 4.0, fatigue: {olympic: 1.0, squat: 0.3, hinge: 0.3, push_v: 0.4}}
power_clean:         {ko: 파워 클린, aliases: ["power clean", "파워클린"], implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.90, cycle_s: 3.0, fatigue: {olympic: 1.0, hinge: 0.4}}
hang_power_clean:    {ko: 행 파워 클린, aliases: ["hang power clean", "행 파워클린", "HPC"], implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.85, cycle_s: 2.5, fatigue: {olympic: 1.0, hinge: 0.3}}
hang_clean:          {ko: 행 클린, aliases: ["hang clean", "hang squat clean", "행클린"], implement: barbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.92, cycle_s: 3.0, fatigue: {olympic: 1.0, squat: 0.3, hinge: 0.3}}
db_snatch:           {ko: 덤벨 스내치, aliases: ["db snatch", "dumbbell snatch", "덤벨스내치"], implement: dumbbell, hands: 1, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.50, cycle_s: 2.2, fatigue: {olympic: 0.7, hinge: 0.3, push_v: 0.2}}
devil_press:         {ko: 데빌 프레스, aliases: ["devil press", "devils press", "데빌프레스"], implement: dumbbell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.38, cycle_s: 6.0, fatigue: {olympic: 0.6, push_h: 0.3, hinge: 0.4, plyo: 0.5}}
kb_head_cutter:      {ko: 헤드 커터, aliases: ["head cutter", "kb head cutter", "헤드커터"], implement: kettlebell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.33, cycle_s: 4.0, fatigue: {olympic: 0.5, squat: 0.5, push_v: 0.4}}

# ── 코어 ──────────────────────────────────────────────────
