kb_head_cutter:      {ko: 헤드 커터, implement: kettlebell, pattern: olympic, cat: W, ref: clean_and_jerk, ratio: 0.33, cycle_s: 4.0, fatigue: {olympic: 0.5, squat: 0.5, push_v: 0.4}}

